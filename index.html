<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>網頁版蛇梯棋</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        #game-container { display: flex; gap: 20px; align-items: flex-start; margin-top: 15px; }
        #board { display: grid; grid-template-columns: repeat(10, 55px); grid-template-rows: repeat(10, 55px); border: 3px solid #333; background-color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .cell { border: 1px solid #ddd; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; position: relative; }
        .ladder { background-color: #e6f4ea; color: #137333; }
        .snake { background-color: #fce8e6; color: #c5221f; }
        .token-container { position: absolute; bottom: 2px; left: 2px; right: 2px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; align-items: center; min-height: 15px; }
        .token { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.4); display: block; transition: all 0.15s ease-in-out; }
        #controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-width: 240px; max-height: 85vh; overflow-y: auto; }
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; display: block; text-align: center; }
        #btn-start { background-color: #007bff; }
        #btn-roll { background-color: #28a745; }
        #status { font-size: 16px; margin-top: 15px; font-weight: bold; min-height: 70px; line-height: 1.4; }
        .player-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; }
        .name-input-group { display: flex; align-items: center; margin-top: 6px; font-size: 14px; }
        .name-input-group label { width: 85px; font-weight: bold; }
        .name-input-group input { flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; display: inline-block; border: 1px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <h1>台灣手語辭彙蛇梯棋(Snakes & Ladders)</h1>
    <div id="game-container">
        <div id="board"></div>
        <div id="controls">
            <div class="setup-section">
                <label style="font-weight: bold;">👥 設定玩家人數：</label>
                <select id="player-count">
                    <option value="2">2 人對戰</option>
                    <option value="3">3 人對戰</option>
                    <option value="4" selected>4 人對戰</option>
                    <option value="5">5 人對戰</option>
                    <option value="6">6 人對戰</option>
                    <option value="7">7 人對戰</option>
                    <option value="8">8 人對戰</option>
                </select>
                <div id="name-inputs-area"></div>
                <button class="btn" id="btn-start" onclick="startGame()">開始新遊戲</button>
            </div>
            <div id="status">設定好人數與名字後，點擊上方開始！</div>
            <button class="btn" id="btn-roll" onclick="rollDice()" disabled style="opacity: 0.5;">🎲 擲骰子</button>
            <p id="dice-result" style="font-size: 20px; font-weight: bold; text-align: center; margin: 15px 0;">點數：-</p>
            <hr>
            <p>🧗 <strong>梯子格：</strong>順著爬上去</p>
            <p>🐍 <strong>蛇頭格：</strong>被咬滑下去</p>
        </div>
    </div>
    <!-- 💡 本次修正：依序引入自訂詞彙字典檔與主要邏輯檔 -->
    <script src="labels.js"></script>
    <script src="game.js"></script>
</body>
</html>
